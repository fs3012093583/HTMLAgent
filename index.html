<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTMLAgent Hyperpage</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667284;
      --line: #d8dfd7;
      --blue: #2563eb;
      --green: #14785f;
      --amber: #9b6400;
      --rose: #b42348;
      --soft: #edf2f7;
      --shadow: 0 18px 42px rgba(23, 32, 42, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(246, 247, 244, 0.96)),
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.1), transparent 28rem),
        radial-gradient(circle at 88% 84%, rgba(20, 120, 95, 0.11), transparent 32rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      width: min(1500px, calc(100vw - 28px));
      height: calc(100vh - 28px);
      margin: 14px auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      min-width: 0;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.76);
    }

    .brand {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .status {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 12px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(20, 120, 95, 0.11);
    }

    .composer {
      display: grid;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .prompt {
      width: 100%;
      min-height: 92px;
      resize: none;
      border: 1px solid #c7d0d8;
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
      line-height: 1.48;
    }

    .prompt:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip,
    .primary,
    .ghost,
    .tree-item {
      border-radius: 8px;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .chip {
      border: 1px solid transparent;
      padding: 7px 10px;
      color: #334155;
      background: #edf2f7;
      font-size: 13px;
    }

    .primary {
      min-height: 40px;
      border: 0;
      padding: 9px 12px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
    }

    .primary:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .ghost {
      border: 1px solid var(--line);
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
    }

    .chip:hover,
    .primary:hover:not(:disabled),
    .ghost:hover {
      transform: translateY(-1px);
    }

    .tree {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .tree-empty {
      padding: 16px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .tree-children {
      margin-left: 14px;
      padding-left: 10px;
      border-left: 1px solid var(--line);
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 3px 0;
      border: 1px solid transparent;
      padding: 7px 8px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      font-size: 13px;
    }

    .tree-item.active {
      border-color: rgba(37, 99, 235, 0.28);
      background: rgba(37, 99, 235, 0.08);
      color: #1746a2;
    }

    .tree-item:hover {
      background: #eef3f7;
    }

    .tree-icon {
      width: 18px;
      color: var(--muted);
      text-align: center;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      background: rgba(255, 255, 255, 0.58);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    .path {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      min-height: 0;
      overflow: auto;
      padding: 22px;
    }

    .empty-state {
      display: grid;
      place-content: center;
      min-height: 100%;
      color: var(--muted);
      text-align: center;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 24px;
    }

    .node-stack {
      display: grid;
      gap: 18px;
      max-width: 980px;
      margin: 0 auto 64px;
    }

    .node {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 30px rgba(23, 32, 42, 0.07);
    }

    .node.child {
      margin-left: min(44px, 6vw);
    }

    .node.child::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 24px;
      width: 1px;
      height: 18px;
      background: var(--line);
    }

    .node-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid #eef2f3;
    }

    .node-title h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .node-title p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .node-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .node-body {
      padding: 16px 18px 8px;
      line-height: 1.68;
    }

    .node-body h2,
    .node-body h3 {
      margin: 18px 0 8px;
      line-height: 1.25;
    }

    .node-body p,
    .node-body ul,
    .node-body ol,
    .node-body blockquote {
      margin: 0 0 12px;
    }

    .node-body code {
      border-radius: 6px;
      padding: 2px 5px;
      background: #edf2f7;
    }

    .node-body pre {
      overflow: auto;
      border-radius: 8px;
      padding: 12px;
      background: #101923;
      color: #dbeafe;
    }

    .node-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 18px 18px;
    }

    .concept {
      display: inline-grid;
      gap: 3px;
      max-width: 280px;
      border: 1px solid #cbd8e4;
      border-radius: 8px;
      padding: 9px 11px;
      color: #123b74;
      background: #f5f9ff;
      text-align: left;
    }

    .concept strong {
      font-size: 14px;
    }

    .concept span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .children-note {
      padding: 0 18px 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      border: 1px solid rgba(180, 35, 72, 0.25);
      border-radius: 8px;
      margin: 0 auto 14px;
      max-width: 980px;
      padding: 12px 14px;
      color: var(--rose);
      background: rgba(180, 35, 72, 0.06);
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 20px);
      }

      .sidebar {
        min-height: 420px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        min-height: 700px;
      }

      .node.child {
        margin-left: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar" aria-label="knowledge tree">
      <header class="brand">
        <div>
          <h1>HTMLAgent</h1>
          <p>递归超文本知识浏览器</p>
        </div>
        <div id="statusLabel" class="status"><span class="dot"></span>Ready</div>
      </header>

      <form id="composer" class="composer">
        <textarea id="prompt" class="prompt" placeholder="输入一个主题，例如：介绍 Transformer"></textarea>
        <button id="sendButton" class="primary" type="submit">生成根页面</button>
        <div class="samples">
          <button class="chip" type="button" data-sample="介绍 Transformer">Transformer</button>
          <button class="chip" type="button" data-sample="解释扩散模型">扩散模型</button>
          <button class="chip" type="button" data-sample="介绍 GraphRAG">GraphRAG</button>
        </div>
      </form>

      <nav id="tree" class="tree" aria-label="page tree">
        <div class="tree-empty">还没有知识树。输入一个主题后，AI 会生成第一个伪网页。</div>
      </nav>
    </aside>

    <section class="main" aria-label="hyperpage workspace">
      <header class="toolbar">
        <div id="path" class="path">等待主题</div>
        <button id="resetButton" class="ghost" type="button">清空</button>
      </header>

      <div id="workspace" class="workspace">
        <div class="empty-state">
          <div>
            <h2>从一个主题开始</h2>
            <p>AI 会生成一个可点击的伪网页。点击页面里的概念，会递归生成子页面并挂到树上。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#composer");
    const promptInput = document.querySelector("#prompt");
    const sendButton = document.querySelector("#sendButton");
    const resetButton = document.querySelector("#resetButton");
    const statusLabel = document.querySelector("#statusLabel");
    const tree = document.querySelector("#tree");
    const workspace = document.querySelector("#workspace");
    const pathLabel = document.querySelector("#path");

    const state = {
      nodes: {},
      rootIds: [],
      activeNodeId: null,
      error: ""
    };

    const saved = localStorage.getItem("htmlagent.hyperpage.v1");
    if (saved) {
      try {
        Object.assign(state, JSON.parse(saved));
      } catch {
        localStorage.removeItem("htmlagent.hyperpage.v1");
      }
    }

    function saveState() {
      localStorage.setItem("htmlagent.hyperpage.v1", JSON.stringify({
        nodes: state.nodes,
        rootIds: state.rootIds,
        activeNodeId: state.activeNodeId
      }));
    }

    function setBusy(isBusy, label = "Ready") {
      sendButton.disabled = isBusy;
      sendButton.textContent = isBusy ? "生成中..." : "生成根页面";
      statusLabel.innerHTML = `<span class="dot"></span>${escapeHtml(label)}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function makeId(prefix = "node") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || `API request failed with status ${response.status}`);
      }
      return data;
    }

    function createNode(page, parentId, sourceLink = null) {
      const id = makeId();
      const node = {
        id,
        parentId,
        title: page.title || sourceLink?.label || "Untitled",
        topic: sourceLink?.topic || page.title || "",
        summary: page.summary || "",
        html: page.html || "",
        links: Array.isArray(page.links) ? page.links : [],
        children: [],
        collapsed: false,
        createdAt: new Date().toISOString()
      };

      state.nodes[id] = node;
      if (parentId) {
        state.nodes[parentId].children.push(id);
      } else {
        state.rootIds.push(id);
      }
      state.activeNodeId = id;
      return node;
    }

    async function createRoot(topic) {
      state.error = "";
      setBusy(true, "Generating");
      try {
        const page = await postJson("/api/page", { topic });
        createNode(page, null, { topic, label: topic });
        saveState();
        render();
        setBusy(false, "Ready");
      } catch (error) {
        state.error = error.message;
        render();
        setBusy(false, "Error");
      }
    }

    async function expandNode(parentId, link) {
      const parent = state.nodes[parentId];
      if (!parent) return;

      state.error = "";
      state.activeNodeId = parentId;
      render();
      setBusy(true, `Expanding ${link.label}`);

      try {
        const page = await postJson("/api/expand", {
          topic: link.topic,
          label: link.label,
          parentTitle: parent.title,
          parentSummary: parent.summary,
          contextPath: getPath(parentId).map((node) => node.title)
        });
        createNode(page, parentId, link);
        parent.collapsed = false;
        saveState();
        render();
        setBusy(false, "Ready");
      } catch (error) {
        state.error = error.message;
        render();
        setBusy(false, "Error");
      }
    }

    function getPath(nodeId) {
      const path = [];
      let current = state.nodes[nodeId];
      while (current) {
        path.unshift(current);
        current = state.nodes[current.parentId];
      }
      return path;
    }

    function renderTree() {
      if (!state.rootIds.length) {
        tree.innerHTML = `<div class="tree-empty">还没有知识树。输入一个主题后，AI 会生成第一个伪网页。</div>`;
        return;
      }

      tree.innerHTML = state.rootIds.map((id) => renderTreeNode(id)).join("");
      tree.querySelectorAll("[data-tree-node]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeNodeId = button.dataset.treeNode;
          saveState();
          render();
        });
      });
    }

    function renderTreeNode(nodeId) {
      const node = state.nodes[nodeId];
      if (!node) return "";
      const hasChildren = node.children.length > 0;
      const children = hasChildren && !node.collapsed
        ? `<div class="tree-children">${node.children.map((id) => renderTreeNode(id)).join("")}</div>`
        : "";

      return `
        <div>
          <button class="tree-item ${node.id === state.activeNodeId ? "active" : ""}" data-tree-node="${node.id}" type="button">
            <span class="tree-icon">${hasChildren ? "▾" : "•"}</span>
            <span>${escapeHtml(node.title)}</span>
          </button>
          ${children}
        </div>
      `;
    }

    function renderWorkspace() {
      if (!state.rootIds.length || !state.activeNodeId) {
        pathLabel.textContent = "等待主题";
        workspace.innerHTML = `
          <div class="empty-state">
            <div>
              <h2>从一个主题开始</h2>
              <p>AI 会生成一个可点击的伪网页。点击页面里的概念，会递归生成子页面并挂到树上。</p>
            </div>
          </div>
        `;
        return;
      }

      const path = getPath(state.activeNodeId);
      pathLabel.textContent = path.map((node) => node.title).join(" > ");
      const errorHtml = state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : "";
      workspace.innerHTML = `
        ${errorHtml}
        <div class="node-stack">
          ${path.map((node, index) => renderNode(node, index > 0)).join("")}
        </div>
      `;

      workspace.querySelectorAll("[data-expand-link]").forEach((button) => {
        button.addEventListener("click", () => {
          const parentId = button.dataset.parentId;
          const linkIndex = Number(button.dataset.linkIndex);
          const link = state.nodes[parentId]?.links[linkIndex];
          if (link) expandNode(parentId, link);
        });
      });

      workspace.querySelectorAll("[data-toggle-node]").forEach((button) => {
        button.addEventListener("click", () => {
          const node = state.nodes[button.dataset.toggleNode];
          if (!node) return;
          node.collapsed = !node.collapsed;
          saveState();
          render();
        });
      });
    }

    function renderNode(node, isChild) {
      return `
        <article class="node ${isChild ? "child" : ""}">
          <header class="node-header">
            <div class="node-title">
              <h2>${escapeHtml(node.title)}</h2>
              ${node.summary ? `<p>${escapeHtml(node.summary)}</p>` : ""}
            </div>
            <div class="node-actions">
              <button class="ghost" data-toggle-node="${node.id}" type="button">${node.collapsed ? "展开" : "折叠"}</button>
            </div>
          </header>
          ${node.collapsed ? "" : `
            <div class="node-body">${node.html}</div>
            <div class="node-links">
              ${node.links.map((link, index) => renderConcept(node.id, link, index)).join("")}
            </div>
            ${node.children.length ? `<div class="children-note">已展开 ${node.children.length} 个子页面，可在左侧树中切换。</div>` : ""}
          `}
        </article>
      `;
    }

    function renderConcept(parentId, link, index) {
      return `
        <button class="concept" data-expand-link data-parent-id="${parentId}" data-link-index="${index}" type="button">
          <strong>${escapeHtml(link.label || link.topic)}</strong>
          ${link.description ? `<span>${escapeHtml(link.description)}</span>` : ""}
        </button>
      `;
    }

    function render() {
      renderTree();
      renderWorkspace();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const topic = promptInput.value.trim();
      if (!topic) return;
      await createRoot(topic);
    });

    document.querySelectorAll("[data-sample]").forEach((button) => {
      button.addEventListener("click", async () => {
        promptInput.value = button.dataset.sample;
        await createRoot(button.dataset.sample);
      });
    });

    resetButton.addEventListener("click", () => {
      state.nodes = {};
      state.rootIds = [];
      state.activeNodeId = null;
      state.error = "";
      localStorage.removeItem("htmlagent.hyperpage.v1");
      render();
    });

    render();
  </script>
</body>
</html>
